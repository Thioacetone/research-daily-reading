name: Update daily chemistry reading

on:
  schedule:
    - cron: '17 16 * * *'
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-daily-chemistry-reading
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      day: ${{ steps.state.outputs.day }}
      run: ${{ steps.state.outputs.run }}
      lanes: ${{ steps.state.outputs.lanes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: unzip -o reading-generator.zip
      - id: state
        run: python -X utf8 website_daily.py preflight
      - name: Check quotas and persistent history without models
        run: |
          python -X utf8 -m unittest discover -s tests -p test_reading_policy.py -v
          python -X utf8 -m unittest discover -s tests -p test_paper_library.py -v
          python -X utf8 -m unittest discover -s tests -p test_website_daily.py -v

  review:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 320
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        lane: ${{ fromJSON(needs.preflight.outputs.lanes) }}
    env:
      PYTHONUTF8: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OPENBLAS_NUM_THREADS: '2'
      READING_DAY: ${{ needs.preflight.outputs.day }}
      READING_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: unzip -o reading-generator.zip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: website-reading-qwen3-4b-bc64014-v1
      - uses: actions/cache@v4
        with:
          path: |
            data/recommendation-fulltext
            data/recommendation-analysis
            data/summaries/bilingual
          key: website-editorial-${{ matrix.lane }}-${{ github.run_id }}
          restore-keys: website-editorial-${{ matrix.lane }}-
      - name: Install local CPU editor, without an AI service key
        run: python -m pip install -r requirements-summary.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu --only-binary=llama-cpp-python --timeout 120 --retries 3
      - name: Read and analyze original full texts
        run: python -X utf8 website_daily.py worker --date "$READING_DAY" --lane "$READING_LANE" --output "pool/$READING_LANE.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-pool-${{ matrix.lane }}
          path: pool/*.json
          if-no-files-found: ignore
          retention-days: 2

  publish:
    needs: [preflight, review]
    if: always() && needs.preflight.outputs.run == 'true' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      READING_DAY: ${{ needs.preflight.outputs.day }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: unzip -o reading-generator.zip
      - run: python -m pip install 'Pillow>=10'
      - uses: actions/download-artifact@v4
        with:
          pattern: reading-pool-*
          path: pool
          merge-multiple: true
      - name: Require 10 new papers, at least 5 priority, at most 3 per direction
        run: python -X utf8 website_daily.py combine --date "$READING_DAY" --pools pool
      - name: Package only validated reports
        run: python -X utf8 package_streamlit.py
      - name: Publish website data and identity history together
        run: |
          cp dist/streamlit-reader/reading-content.zip reading-content.zip
          cp dist/streamlit-reader/site-publication.json site-publication.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading-content.zip site-publication.json reading-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated daily chemistry reading $READING_DAY"
            git push origin HEAD:main
          fi
