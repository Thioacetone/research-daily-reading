name: Build Android reading app
on:
  workflow_dispatch:
  push:
    paths: ['android-reader-source.zip', '.github/workflows/android-reader.yml']
permissions:
  contents: write
concurrency:
  group: android-reader-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Expand reviewed Android source
        run: unzip -o android-reader-source.zip
      - name: Build installable APK
        run: |
          set -o pipefail
          gradle -p android-reader --no-daemon assembleDebug lintDebug 2>&1 | tee android-build.log
      - name: Keep readable diagnostics if building failed
        if: failure()
        run: |
          echo '## Android build diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -150 android-build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-diagnostics
          path: |
            android-build.log
            android-reader/app/build/reports/lint-results-debug.*
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: daily-reading-android
          path: android-reader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish a permanent APK download alongside the reader
        run: |
          cp android-reader/app/build/outputs/apk/debug/app-debug.apk daily-reading-android.apk
          sha256sum daily-reading-android.apk > daily-reading-android.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daily-reading-android.apk daily-reading-android.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Publish validated Android reader APK'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
