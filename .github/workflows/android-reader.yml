name: Build Android reading app
on:
  workflow_dispatch:
  push:
    paths: ['android-reader-source.zip', '.github/workflows/android-reader.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Expand reviewed Android source
        run: unzip -o android-reader-source.zip
      - name: Build installable APK
        run: gradle -p android-reader --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: daily-reading-android
          path: android-reader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
